# aliasmux workspace: the runtime (crates/core) and the tool that creates
# aliases from it (crates/aliasmux, which also builds the stub).
[workspace]
resolver = "3"
members = ["crates/core", "crates/aliasmux"]

[workspace.package]
version = "0.5.2"
edition = "2024"

[workspace.dependencies]
aliasmux-core = { path = "crates/core" }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
libc = "0.2.190"

# Small, fast-starting static binaries. None of these change behavior.
[profile.release]
# No unwinding machinery; a panic is a bug here, so aborting is fine.
panic = "abort"
lto = true
# Arbitrary trade-off: slower builds for slightly better LTO.
codegen-units = 1
strip = true

