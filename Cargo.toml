# rea workspace: the runtime (crates/core) and the tool that creates
# aliases from it (crates/rea, which also builds the stub).
[workspace]
resolver = "3"
members = ["crates/core", "crates/rea"]

[workspace.package]
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kliberty/rea"

[workspace.dependencies]
# The version must match [workspace.package] above: crates.io needs one, and
# cargo drops the path when packaging. Bump both together.
rea-core = { path = "crates/core", version = "0.7.2" }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
libc = "0.2.190"

# Small, fast-starting static binaries. None of these change behavior.
[profile.release]
# No unwinding machinery; a panic is a bug here, so aborting is fine.
panic = "abort"
lto = true
# Arbitrary trade-off: slower builds for slightly better LTO.
codegen-units = 1
strip = true

