# aliasmux workspace: one runtime (crates/core), four ways to package aliases.
[workspace]
resolver = "3"
members = ["crates/core", "crates/aliasmux", "crates/stub", "crates/shared", "crates/single"]
# Plain `cargo build` / `cargo test` skip `single`, which only makes sense
# with ALIASMUX_NAME set. scripts/build_variants.py builds it once per alias.
default-members = ["crates/core", "crates/aliasmux", "crates/stub", "crates/shared"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
aliasmux-core = { path = "crates/core" }
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"

# Small, fast-starting static binaries. None of these change behavior.
[profile.release]
# No unwinding machinery; a panic is a bug here, so aborting is fine.
panic = "abort"
lto = true
# Arbitrary trade-off: slower builds for slightly better LTO.
codegen-units = 1
strip = true

