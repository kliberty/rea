[package]
name = "aliasmux-single"
description = "One separately compiled executable per alias, from generated src/bin/<alias>.rs files"
version.workspace = true
edition.workspace = true

# The bins are the files in src/bin, which `aliasmux gen-single src/bin`
# writes (one per alias) and Cargo discovers automatically. Each is its own
# target, so Cargo compiles them in parallel and rebuilds only changed ones.

[dependencies]
aliasmux-core.workspace = true
