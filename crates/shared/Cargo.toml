[package]
name = "aliasmux-shared"
description = "The aliasmux runtime as a C-ABI shared library, for small stubs that link it dynamically"
version.workspace = true
edition.workspace = true

# A C-ABI shared library with Rust's std linked statically inside it, so it
# has no dependency on a matching rustc or libstd.so. The C interface is
# declared in c/aliasmux.h.
[lib]
crate-type = ["cdylib"]

[dependencies]
aliasmux-core.workspace = true
