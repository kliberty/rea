[package]
name = "aliasmux"
description = "Command aliases with numbered arguments and real pipelines, no shell"
version.workspace = true
edition.workspace = true

# Two binaries, built side by side: `aliasmux` (src/main.rs), the tool that
# creates aliases, and `aliasmux-stub` (src/bin/aliasmux-stub.rs), the
# executable it copies and patches once per alias. clap is linked only into
# `aliasmux`, since the stub never references it.

# Constraint on change: the stub has `#![no_main]`, so a test build of it
# would run the stub instead of a test harness. It has no tests of its own;
# the integration tests run real aliases made from it.
[[bin]]
name = "aliasmux-stub"
path = "src/bin/aliasmux-stub.rs"
test = false

[dependencies]
aliasmux-core.workspace = true
clap.workspace = true
